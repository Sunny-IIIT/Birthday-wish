<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1726" />
      <stop offset="50%" stop-color="#182c44" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg3)" rx="16" />
  
  <g transform="translate(300, 170)">
    <!-- Globe / Connection lines -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#64b5f6" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="-35" cy="-10" r="10" fill="#ff4b72"/>
    <circle cx="35" cy="15" r="10" fill="#ff4b72"/>
    <path d="M-35 -10 Q0 -60 35 15" fill="none" stroke="#ffd700" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="0" y="5" font-family="sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">✈️</text>
  </g>

  <text x="300" y="310" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#90caf9" text-anchor="middle">3+ Years of Long Distance</text>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#bbdefb" text-anchor="middle" opacity="0.85">Miles couldn't touch what we built ❤️</text>

  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#64b5f6" stroke-opacity="0.2" stroke-width="2" rx="12" stroke-dasharray="8 6"/>
</svg>
