<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0813" />
      <stop offset="50%" stop-color="#4a1226" />
      <stop offset="100%" stop-color="#18040a" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4b72" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2a0813" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#bg1)" rx="16" />
  <circle cx="300" cy="225" r="180" fill="url(#glow)" />
  
  <!-- Subtle sparkles -->
  <circle cx="120" cy="90" r="3" fill="#ffb7c5" opacity="0.8"/>
  <circle cx="480" cy="110" r="4" fill="#ffb7c5" opacity="0.6"/>
  <circle cx="150" cy="350" r="2" fill="#ffb7c5" opacity="0.9"/>
  <circle cx="450" cy="340" r="3" fill="#ffb7c5" opacity="0.7"/>
  
  <!-- Central Heart & Phone Icon -->
  <g transform="translate(300, 180) scale(1.2)">
    <path d="M0 -30 C-20 -50 -50 -30 -50 0 C-50 25 0 50 0 60 C0 50 50 25 50 0 C50 -30 20 -50 0 -30 Z" fill="url(#heartGrad)" filter="drop-shadow(0px 8px 16px rgba(255, 75, 114, 0.4))"/>
    <text x="0" y="10" font-family="'Cinzel', serif, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">10.10.2020</text>
  </g>
  
  <!-- Romantic Label -->
  <text x="300" y="310" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#ffd700" text-anchor="middle">The Day We Exchanged Numbers</text>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#ffb7c5" text-anchor="middle" opacity="0.85">Where our beautiful story began ❤️</text>
  
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#ff4b72" stroke-opacity="0.2" stroke-width="2" rx="12" stroke-dasharray="8 6"/>
</svg>
